<!doctype html>
<!-- 図面練習CAD（入社前ノート）— 個人学習用。AutoCAD・Jw_cad 本体ではありません。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>図面練習CAD｜入社前ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECE8; --panel:#FFFFFF; --ink:#1D2926; --ink-2:#56665F; --line:#C5CFC9;
  --accent:#28402F; --accent-ink:#EEF1E6; --tape:#C99A1E;
  --paper:#FFFFFF; --desk:#CFD8D3; --frame:#8C9C95; --gridc:#A6B5AE;
  --selc:#1F6FD1; --grip:#1F6FD1; --snap:#D17A00; --track:#2E9E62; --prev:#D17A00;
  --l0:#5A6E8A; --l1:#18201D; --l2:#1F7A72; --l3:#2F62B0; --l4:#3B3F3D; --l5:#C0392B; --l6:#B86E00; --l7:#8A9590;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --panel:#17201C; --ink:#E1E7E3; --ink-2:#9FB0A9; --line:#33433D;
    --accent:#3D6A50; --accent-ink:#F0F3EA; --tape:#E0B544;
    --paper:#0E1915; --desk:#070B0A; --frame:#4C5E57; --gridc:#3D5249;
    --selc:#5AA2FF; --grip:#5AA2FF; --snap:#FFB020; --track:#4CD18A; --prev:#FFB020;
    --l0:#8FA3C0; --l1:#EDEFEA; --l2:#5CC4B9; --l3:#7FA8F0; --l4:#C9CFCB; --l5:#FF7A6B; --l6:#F0A640; --l7:#7C8A84;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --panel:#17201C; --ink:#E1E7E3; --ink-2:#9FB0A9; --line:#33433D;
  --accent:#3D6A50; --accent-ink:#F0F3EA; --tape:#E0B544;
  --paper:#0E1915; --desk:#070B0A; --frame:#4C5E57; --gridc:#3D5249;
  --selc:#5AA2FF; --grip:#5AA2FF; --snap:#FFB020; --track:#4CD18A; --prev:#FFB020;
  --l0:#8FA3C0; --l1:#EDEFEA; --l2:#5CC4B9; --l3:#7FA8F0; --l4:#C9CFCB; --l5:#FF7A6B; --l6:#F0A640; --l7:#7C8A84;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:1px;border-radius:4px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:fixed;inset:0;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "tb stage side" "bar bar bar";
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* 上：コマンドライン */
.top{grid-area:top;display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:34px;min-width:34px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;font-size:.84rem;white-space:nowrap;text-decoration:none;flex:none}
.ib:disabled{opacity:.4;cursor:default}
.ib[aria-pressed="true"],.ib.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ib.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cmdline{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1.5px solid var(--ink-2);border-radius:8px;padding:2px 4px 2px 10px;background:var(--bg);height:36px}
#prompt{flex:1;min-width:0;overflow:hidden;font-size:.86rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
#prompt b{color:var(--accent);margin-right:.5em}
:root[data-theme="dark"] #prompt b{color:var(--tape)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) #prompt b{color:var(--tape)} }
#cmd{width:9.5em;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 8px;font-size:16px;font-variant-numeric:tabular-nums}
.menu{position:relative;flex:none}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;display:flex;flex-direction:column;min-width:14em;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
.pop button,.pop label{display:block;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;font-size:.9rem}
.pop button:hover,.pop label:hover{background:var(--bg)}
.pop input[type=file]{display:none}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.danger{color:var(--l5)}

/* 左：ツール */
.tb{grid-area:tb;width:100px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;border-bottom:1px solid var(--line)}
.grp button{height:26px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:.76rem;padding:0}
.grp button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.tools{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:3px;padding:5px;scrollbar-width:thin}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:48px;padding:3px 1px 2px;border:1px solid transparent;border-radius:7px;background:transparent;cursor:pointer;font-size:.66rem;line-height:1.2;color:var(--ink-2)}
.tool:hover{border-color:var(--line)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool.t-dmg svg{stroke:var(--l5)} .tool.t-photo svg{stroke:var(--l6)}
.tool[aria-pressed="true"] svg{stroke:currentColor}

/* 中央：作図エリア */
.stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--desk)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
#cv.hand{cursor:grab}
#optbar{position:absolute;left:8px;top:8px;right:60px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;z-index:5}
#optbar button{pointer-events:auto;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--accent);background:var(--panel);color:var(--ink);cursor:pointer;font-size:.84rem;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#optbar button.on{background:var(--accent);color:var(--accent-ink)}
#tip{position:absolute;z-index:6;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.78rem;line-height:1.45;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
#tip b{color:var(--snap)}
#loupe{position:absolute;z-index:7;width:132px;height:132px;border-radius:50%;overflow:hidden;border:3px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none;background:var(--paper)}
#loupe svg{width:100%;height:100%;display:block}
#loupe i{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;background:linear-gradient(var(--snap),var(--snap)) center/2px 100% no-repeat,linear-gradient(var(--snap),var(--snap)) center/100% 2px no-repeat;opacity:.85}
.zoom{position:absolute;right:8px;bottom:8px;z-index:5;display:flex;flex-direction:column;gap:5px}
.zoom button{width:44px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.zoom button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#keypad{position:absolute;right:60px;bottom:8px;z-index:8;display:grid;grid-template-columns:repeat(6,44px);gap:5px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.22)}
#keypad[hidden]{display:none}
#keypad button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.05rem;font-variant-numeric:tabular-nums}
#keypad .w2{grid-column:span 6;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:.9rem;font-weight:700}
#keypad .sm{font-size:.78rem}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;max-width:min(560px,80%);background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 14px;font-size:.86rem;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.stage.has-les #toast{bottom:auto;top:48px}
#lesBar .lt{cursor:pointer}
#lesBar{position:absolute;left:8px;right:60px;bottom:8px;z-index:6;display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:8px;padding:6px 8px 6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.14);font-size:.84rem;line-height:1.4;max-width:560px}
#lesBar[hidden]{display:none}
#lesBar .lt{flex:1;min-width:0}
#lesBar .lt small{color:var(--ink-2);font-size:.76rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#lesBar .lt b{color:var(--ink-2);font-weight:400;margin-right:.4em;font-size:.76rem}
#lesBar button{flex:none;height:28px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:.76rem}
#rotHint{position:absolute;left:8px;right:8px;top:48px;z-index:4;display:none;background:var(--panel);border:1px solid var(--tape);border-radius:8px;padding:6px 10px;font-size:.82rem}
@media (orientation:portrait) and (max-width:620px){ #rotHint{display:block} }

/* 右：パネル */
.side{grid-area:side;width:310px;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
.side.closed{display:none}
.stabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.stabs button{flex:1;padding:8px 2px;border:0;border-bottom:3px solid transparent;background:transparent;cursor:pointer;font-size:.84rem;color:var(--ink-2)}
.stabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow:auto;padding:10px 12px 24px;-webkit-overflow-scrolling:touch}
.pane[hidden]{display:none}
.pane h3{font-size:.95rem;margin:12px 0 6px}
.pane h3:first-child{margin-top:2px}
.pane p{margin:.4em 0}
.note{font-size:.8rem;color:var(--ink-2)}
.f{display:grid;grid-template-columns:5.6em 1fr auto;gap:6px;align-items:center;margin:6px 0;font-size:.86rem}
.f input,.f select{width:100%;min-width:0;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px 8px;font-size:16px}
.f .u{font-size:.76rem;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.84rem;margin:6px 0;font-variant-numeric:tabular-nums}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.box{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.84rem;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sb{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;font-size:.84rem}
.sb.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.lys{list-style:none;margin:4px 0 8px;padding:0}
.lys li{display:grid;grid-template-columns:28px 1fr auto auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.lys li.cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.lys .sw{width:22px;height:5px;border-radius:3px}
.lys button{height:28px;min-width:40px;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:.74rem}
.lys button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lys .cnt{font-size:.74rem;color:var(--ink-2)}
/* 練習（チュートリアル） */
.les{list-style:none;padding:0;margin:4px 0}
.les li{border-bottom:1px solid var(--line)}
.les button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:9px 2px;cursor:pointer;font-size:.88rem}
.les .no{flex:none;width:2.2em;font-size:.76rem;color:var(--ink-2)}
.les .st{flex:none;margin-left:auto;font-size:.72rem;font-weight:700;padding:0 6px;border-radius:4px;background:var(--line)}
.les .st.ok{background:var(--l2);color:#fff}
.steps{list-style:none;padding:0;margin:8px 0;counter-reset:s}
.steps li{position:relative;padding:8px 0 8px 32px;border-bottom:1px dashed var(--line);font-size:.86rem;counter-increment:s;color:var(--ink-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;border:1.5px solid var(--line)}
.steps li.now{color:var(--ink)}
.steps li.now::before{background:var(--tape);border-color:var(--tape);color:#fff}
.steps li.ok::before{content:"✓";background:var(--l2);border-color:var(--l2);color:#fff}
.steps li.ok{color:var(--ink-2)}
.steps .h{display:block;font-size:.78rem;color:var(--ink-2);margin-top:3px}
.steps li.now .h{color:var(--ink-2)}
.steps input{width:7em;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px 8px;font-size:16px}
.hl{outline:3px solid var(--tape)!important;outline-offset:1px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){ .hl{animation:none} #toast{transition:none} }

/* 下：ステータスバー */
.bar{grid-area:bar;display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;font-size:.78rem}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:.76rem;color:var(--ink-2)}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.bar select{flex:none;height:26px;font-size:.78rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 4px}
#coord{flex:none;margin-left:auto;padding-left:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 説明書・ダイアログ */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;max-width:min(980px,96vw);width:96vw;max-height:94vh;height:94vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
#dlg{height:auto;width:min(460px,92vw);padding:16px 18px}
#dlg input{width:100%;margin:8px 0 12px;height:36px;font-size:16px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg)}
.dlgb{display:flex;justify-content:flex-end;gap:8px}
.man{display:grid;grid-template-columns:220px 1fr;height:100%}
.man nav{border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
.man nav h2{font-size:1rem;margin:4px 6px 8px}
.man nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:.86rem;line-height:1.4}
.man nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.man article{overflow:auto;padding:16px 22px 40px;-webkit-overflow-scrolling:touch;line-height:1.8;font-size:.93rem}
.man article h2{font-size:1.25rem;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink-2)}
.man article h3{font-size:1.02rem;margin:20px 0 6px}
.man article p,.man article li{max-width:44em}
.man article table{border-collapse:collapse;margin:8px 0;font-size:.86rem;min-width:min(100%,30em)}
.man article th,.man article td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.man article th{background:var(--bg);white-space:nowrap}
.man .tw{overflow-x:auto}
.man kbd{font-family:inherit;font-size:.82em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg)}
.man code{font-size:.92em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-variant-numeric:tabular-nums}
.man .tipbox{border-left:4px solid var(--tape);background:var(--bg);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.88rem}
.manhead{display:none}
.manclose{position:absolute;right:10px;top:10px}
@media (max-width:760px){
  .man{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .man nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 50px 6px 6px}
  .man nav h2{display:none}
  .man nav button{flex:none;width:auto;white-space:nowrap}
  .man article{padding:12px 14px 30px}
}

/* 画面が小さいとき（スマホ横向きなど） */
@media (max-width:1100px){
  .side{grid-area:auto;position:absolute;right:env(safe-area-inset-right,0px);top:calc(env(safe-area-inset-top,0px) + 45px);bottom:calc(env(safe-area-inset-bottom,0px) + 35px);z-index:30;width:min(330px,64vw);box-shadow:-8px 0 24px rgba(0,0,0,.18)}
  #app{grid-template-columns:auto minmax(0,1fr) 0}
}
@media (max-width:900px){
  .ib .lb{display:none}
  .ib{padding:0 7px}
  #cmd{width:7.5em}
}
@media (max-height:500px){
  .top{padding:3px 6px}
  .ib{height:32px}
  .cmdline{height:34px}
  .tb{width:92px}
  .tool{height:44px;font-size:.62rem}
  .grp button{height:24px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="ib" href="index.html" title="入社前ノートへ" aria-label="入社前ノートへ"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="lb">ノート</span></a>
    <button class="ib" id="bMan" title="説明書"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z"/></svg><span class="lb">説明書</span></button>
    <button class="ib" id="bLearn" title="練習（チュートリアル）"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-4 9 4-9 4zM7 11v4c0 1.5 2.5 3 5 3s5-1.5 5-3v-4"/></svg><span class="lb">練習</span></button>
    <div class="cmdline">
      <div id="prompt" aria-live="polite"></div>
      <input id="cmd" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="数値・コマンド" aria-label="コマンド・数値の入力">
    </div>
    <button class="ib go" id="bEnter" title="確定（Enter）">確定</button>
    <button class="ib" id="bEsc" title="取消（Esc）">取消</button>

const locked = e => st.lay[e.layer] ? st.lay[e.layer].lock : false;
function W(){ return svg.clientWidth || 800; }
function H(){ return svg.clientHeight || 450; }

/* ================= 幾何 ================= */
function span(e){ const s = normA(e.a2 - e.a1); return s < 1e-9 ? TAU : s; }

function onArc(pr, th){ if(pr.full) return true; const d = normA(th - pr.a1), tol = 1e-7 + 1e-4/Math.max(pr.r, 1); return d <= (pr.a2 - pr.a1) + tol || d >= TAU - tol; }

function lineCircle(a, b, c, r){

    if(!visible(e)) return;

    if(e.type === 'line'){ if(os.end) cands.push({p:P(e.x1,e.y1), k:'end'}, {p:P(e.x2,e.y2), k:'end'}); if(os.mid) cands.push({p:P((e.x1+e.x2)/2,(e.y1+e.y2)/2), k:'mid'}); }

function trackSVG(b, a, k){ const L = (W()+H())/view.s, e = add(b, mul(P(Math.cos(a),Math.sin(a)), L)); return '<line x1="'+b.x+'" y1="'+(-b.y)+'" x2="'+e.x+'" y2="'+(-e.y)+'" style="stroke:var(--track);stroke-width:'+(1*k).toFixed(3)+';stroke-dasharray:'+(2*k).toFixed(2)+' '+(5*k).toFixed(2)+'"/>'; }
function winSVG(w, k){
  const a = toWorld(w.a.x, w.a.y), b = toWorld(w.b.x, w.b.y), cr = w.b.x < w.a.x;
  const x = Math.min(a.x,b.x), y = Math.min(a.y,b.y), ww = Math.abs(a.x-b.x), hh = Math.abs(a.y-b.y);
  return '<rect x="'+x+'" y="'+(-(y+hh))+'" width="'+ww+'" height="'+hh+'" style="fill:'+(cr ? 'rgba(46,158,98,.12)' : 'rgba(31,111,209,.12)')+';stroke:'+(cr ? 'var(--track)' : 'var(--selc)')+';stroke-width:'+(1.2*k).toFixed(3)+(cr ? ';stroke-dasharray:'+(6*k)+' '+(4*k) : '')+'"/>';
}
function renderPrev(){
  const k = 1/view.s; let h = '';
  if(C && C.def.preview && hv && hv.p){ try{ h += C.def.preview(C, hv.p, k) || ''; }catch(err){} }
  if(hv && hv.p && acceptsPoint()){
    if(hv.track && askBase()) h += trackSVG(askBase(), hv.track.a, k);
    h += hv.snap ? snapGlyph(hv.snap, k) : crossGlyph(hv.p, k);
  }
  if(winSel) h += winSVG(winSel, k);
  gPrev.innerHTML = h;
  updateTip();
}
function updateTip(){
  const tip = $('#tip'), cmd = $('#cmd').value;
  if(!hv || hv.sx == null){ tip.hidden = true; return; }
  const lines = [];
  if(hv.snap && acceptsPoint()) lines.push('<b>'+OSN[hv.snap.k]+'</b>');
  if(C && C.def.tip && hv.p){ const t = C.def.tip(C, hv.p); if(t) lines.push(esc(t)); }
  else if(acceptsPoint() && C.ask.base && hv.p){ const d = sub(hv.p, C.ask.base); lines.push('長さ '+fmtN(len(d))+'　角度 '+fmtA(ang(d))); }
  if(hv.track && acceptsPoint() && !hv.snap) lines.push(st.ortho ? '直交' : '極 '+fmtA(hv.track.a));
  if(cmd) lines.push('入力：'+esc(cmd));
  if(!lines.length){ tip.hidden = true; return; }
  tip.innerHTML = lines.join('<br>'); tip.hidden = false;
  const touchLift = hv.touch ? -150 : 0;
  let x = hv.sx + 18, y = hv.sy + 18 + touchLift;
  if(x > W() - 160) x = hv.sx - 170; if(y < 4) y = 4; if(y > H() - 60) y = hv.sy - 60;
  tip.style.left = x+'px'; tip.style.top = y+'px';
  $('#coord').textContent = hv.p ? 'X '+fmtN(hv.p.x)+'　Y '+fmtN(hv.p.y) : '';
}

const CMD = {};
function startCmd(name){
  if(name === 'UNDO'){ doUndo(); return; }
  if(name === 'REDO'){ doRedo(); return; }
  const def = CMD[name]; if(!def){ toast('コマンドが見つかりません'); return; }
  if(C) cancelCmd(true);
  C = {name, def, d:{}, ask:null};
  if(name !== 'GRIP') lastCmd = name;
  ev.start[name] = (ev.start[name] || 0) + 1;
  showKP(false, true);
  def.start(C);
  renderPrompt(); renderPrev(); schedTut();
}
function endCmd(){ const n = C && C.name; C = null; winSel = null; renderPrompt(); renderPrev(); if(n){ ev.done[n] = (ev.done[n] || 0) + 1; } autoKP(); schedTut(); }
function cancelCmd(silent){ if(!C) return; C = null; winSel = null; renderPrompt(); renderPrev(); autoKP(); if(!silent) toast('取り消しました'); schedTut(); }
function needSel(c, then, msg){
  if(sel.size){ then(); return; }

  ask('select', msg || '対象の図形を選んで「選択完了」（Enter）', {opts:[{key:'SELDONE', label:'選択完了'}]});
}
function selDone(){
  if(!C) return;

function plineDef(label, layer, after){
  return {label,
    start(c){ c.d.pts = []; ask('point','始点を指定'); },
    point(c,p){ const ps = c.d.pts; if(ps.length && dist(ps[ps.length-1],p) < 1e-6) return; ps.push(p); this.next(c); },
    next(c){ const n = c.d.pts.length; if(!n) return ask('point','始点を指定');
      const o = []; if(n >= 3) o.push({key:'C', label:'閉じる'}); if(n >= 2) o.push({key:'U', label:'1つ戻す'}); if(n >= 2) o.push({key:'END', label:'確定（Enter）'});
      ask('point', '次の点を指定' + (n >= 2 ? '（Enterで確定）' : ''), {base:c.d.pts[n-1], opts:o}); },
    finish(c, closed){ const ps = c.d.pts; if(ps.length < 2){ toast('2点以上必要です'); return; }
      if(layer) ensureVis(layer);
      addEnt({type:'pline', closed:!!closed && ps.length >= 3, pts:ps.map(q => [rnd(q.x), rnd(q.y)])}, layer);
      if(after) toast(after); endCmd(); },
    opt(c,k){ if(k === 'C') this.finish(c, true); else if(k === 'U'){ c.d.pts.pop(); this.next(c); } else if(k === 'END') this.finish(c, false); },

function autoMode(p1, p2, p){
  const x0 = Math.min(p1.x,p2.x), x1 = Math.max(p1.x,p2.x), y0 = Math.min(p1.y,p2.y), y1 = Math.max(p1.y,p2.y);
  const ex = p.x < x0 ? x0 - p.x : p.x > x1 ? p.x - x1 : 0, ey = p.y < y0 ? y0 - p.y : p.y > y1 ? p.y - y1 : 0;
  if(ey > 0 && ex === 0) return 'h'; if(ex > 0 && ey === 0) return 'v'; if(ex > 0 && ey > 0) return ey >= ex ? 'h' : 'v';
  return (x1 - x0) >= (y1 - y0) ? 'h' : 'v';
}

document.addEventListener('keydown', e => {
  if(document.querySelector('dialog[open]')) return;
  const t = e.target, inInput = /INPUT|SELECT|TEXTAREA/.test(t.tagName || ''), cmd = $('#cmd');
  if((e.ctrlKey || e.metaKey) && !e.altKey){
    const k = (e.key || '').toLowerCase();
    if(k === 'z' && !inInput){ e.preventDefault(); if(e.shiftKey) doRedo(); else doUndo(); }
    else if(k === 'y' && !inInput){ e.preventDefault(); doRedo(); }
    else if(k === 'a' && !inInput){ e.preventDefault(); selectAll(); }
    return;
  }
  if(e.key === 'F3'){ e.preventDefault(); toggleOs('all'); return; }
  if(e.key === 'F8'){ e.preventDefault(); toggleOrtho(); return; }
  if(e.key === 'F9'){ e.preventDefault(); toggleGridSnap(); return; }
  if(e.key === 'F10'){ e.preventDefault(); togglePolar(); return; }
  if(t === cmd){
    if(e.isComposing) return;
    if(e.key === 'Enter'){ e.preventDefault(); submitCmd(); }
    else if(e.key === 'Escape'){ e.preventDefault(); cmd.value = ''; escape(); cmd.blur(); }
    else if(e.key === ' ' && !(C && C.ask && C.ask.kind === 'text')){ e.preventDefault(); submitCmd(); }
    setTimeout(updateTip, 0); return;
  }
  if(inInput) return;
  if(e.key === 'Escape'){ escape(); return; }
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); submitCmd(); return; }
  if(e.key === 'Delete' || (e.key === 'Backspace' && !cmd.value)){ if(sel.size && !C){ e.preventDefault(); eraseSel(); } return; }
  if(e.key === 'Backspace'){ e.preventDefault(); cmd.value = cmd.value.slice(0, -1); updateTip(); return; }
  if(e.key.length === 1 && !e.altKey){ e.preventDefault(); if(C && C.ask && C.ask.kind === 'text'){ cmd.focus(); } cmd.value += e.key; updateTip(); renderPrev(); }
});

  if(e.type === 'line'){

    h += '<dl class="kv"><dt>頂点</dt><dd>'+ps.length+'点</dd><dt>'+(e.closed ? '周長' : '長さ')+'</dt><dd>'+fmtN(perim(ps, e.closed))+' mm</dd></dl>';
    h += '<label class="f">閉じる<input data-f="closed" type="checkbox" style="width:22px;height:22px"'+(e.closed ? ' checked' : '')+'><span></span></label>';
    if(e.closed){ const r = areaRule(Math.abs(polyArea(ps))); h += '<div class="box">面積 '+r.m2.toFixed(4)+' ㎡<br>算定要領の例（第3位切捨て）：<b>'+r.a2.toFixed(2)+' ㎡</b></div>'; }
    h += '<div class="row"><button class="sb" data-act="explode">線に分解</button></div>';
  } else if(e.type === 'circle'){
    h += numRow('cx','中心 X',r2(e.cx),'mm') + numRow('cy','中心 Y',r2(e.cy),'mm') + numRow('r','半径',r2(e.r),'mm') + numRow('dia','直径',r2(e.r*2),'mm');
    h += '<div class="box">面積 '+areaRule(PI*e.r*e.r).m2.toFixed(4)+' ㎡　円周 '+fmtN(TAU*e.r)+' mm</div>';

    h += '<dl class="kv"><dt>実際の長さ</dt><dd><b>'+fmtN(g.val)+' mm</b></dd></dl>';
    h += '<label class="f">表示の文字<input data-f="ovr" type="text" placeholder="（自動）" value="'+esc(e.ovr || '')+'"><span></span></label>';
    h += '<p class="note">寸法は図形と連動しません。図形を直したら、寸法も消して入れ直すか、グリップで端点を合わせ直します。</p>';
  } else if(e.type === 'photo'){
    h += '<label class="f">番号<input data-f="n" type="text" value="'+esc(e.n)+'"><span></span></label>' + numRow('pa','向き',r2(deg(normS(e.a))),'°') + numRow('x','位置 X',r2(e.x),'mm') + numRow('y','位置 Y',r2(e.y),'mm');
  }
  h += '<div class="row"><button class="sb" data-act="erase">削除</button><button class="sb" data-act="clear">選択解除</button></div>';
  box.innerHTML = h; bindProps(e);
}
function bindProps(e){
  const box = $('#p-prop');
  $$('[data-act]', box).forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if(a === 'erase') eraseSel(); else if(a === 'clear'){ sel.clear(); selChanged(); } else if(a === 'explode') startCmd('EXPLODE');
  }));
  $$('[data-f]', box).forEach(inp => inp.addEventListener('change', () => {
    const f = inp.dataset.f, raw = inp.type === 'checkbox' ? inp.checked : inp.value;
    if(f === 'layerAll'){ if(!raw) return; const ids = Array.from(sel); commit(() => ids.forEach(id => { const x = ent(id); if(x) x.layer = raw; }), true); ev.prop++; renderProps(); return; }
    const v = parseFloat(toHalf(String(raw)).replace(/,/g,''));
    const id = e.id, cur = ent(id); if(!cur) return;
    const o = clone(cur);
    switch(f){
      case 'layer': o.layer = raw; break;
      case 'x1': case 'y1': case 'x2': case 'y2': case 'cx': case 'cy': case 'x': case 'y': if(!isFinite(v)) return; o[f] = rnd(v); break;
      case 'len': case 'ang': { if(!isFinite(v)) return; const a0 = P(o.x1,o.y1), d = sub(P(o.x2,o.y2), a0); const L = f === 'len' ? v : len(d), an = f === 'ang' ? v*PI/180 : ang(d); if(!(L > 0)) return; o.x2 = rnd(a0.x + L*Math.cos(an)); o.y2 = rnd(a0.y + L*Math.sin(an)); break; }
      case 'rw': case 'rh': case 'rx': case 'ry': { if(!isFinite(v)) return; const ri = rectInfo(o); let {x0, y0, w, h} = ri; if(f === 'rw'){ if(!(v > 0)) return; w = v; } if(f === 'rh'){ if(!(v > 0)) return; h = v; } if(f === 'rx') x0 = v; if(f === 'ry') y0 = v; o.pts = [[x0,y0],[x0+w,y0],[x0+w,y0+h],[x0,y0+h]].map(q => [rnd(q[0]), rnd(q[1])]); break; }
      case 'closed': o.closed = !!raw && o.pts.length >= 3; break;
      case 'r': if(!(v > 0)) return; o.r = rnd(v); break;
      case 'dia': if(!(v > 0)) return; o.r = rnd(v/2); break;
      case 'a1': { if(!isFinite(v)) return; const end = normA(o.a1) + span(o); o.a1 = ra(normA(v*PI/180)); o.a2 = ra(o.a1 + normA(end - o.a1)); break; }
      case 'a2': { if(!isFinite(v)) return; const a1 = normA(o.a1); o.a2 = ra(a1 + normA(v*PI/180 - a1)); break; }
      case 't': if(!String(raw).trim()) return; o.t = String(raw); break;
      case 'th': if(!(v > 0)) return; o.h = rnd(v*100); break;
      case 'rot': if(!isFinite(v)) return; o.rot = ra(v*PI/180); break;
      case 'mode': { const lp = dimLinePt(o); o.mode = raw; if(raw === 'h') o.off = rnd(lp.y); else if(raw === 'v') o.off = rnd(lp.x); else o.off = rnd(dot(sub(lp, P(o.x1,o.y1)), lnorm(unit(sub(P(o.x2,o.y2), P(o.x1,o.y1)))))); break; }
      case 'ovr': o.ovr = String(raw); break;
      case 'n': if(!String(raw).trim()) return; o.n = String(raw); break;
      case 'pa': if(!isFinite(v)) return; o.a = ra(v*PI/180); break;
      default: return;
    }
    commit(() => replaceEnt(id, [o]), true); ev.prop++; renderProps(); schedTut();
  }));
}

function dxfText(s){ let o = ''; for(const ch of String(s)){ const c = ch.codePointAt(0); o += c < 128 ? ch : (c < 0x10000 ? '\\U+'+c.toString(16).toUpperCase().padStart(4,'0') : '?'); } return o; }
function buildDXF(){
  const out = [], g = (c,v) => { out.push(String(c)); out.push(String(v)); };
  const n = v => (Math.round(v*1000)/1000).toString();
  g(0,'SECTION'); g(2,'HEADER'); g(9,'$ACADVER'); g(1,'AC1009'); g(9,'$EXTMIN'); g(10,0); g(20,0); g(9,'$EXTMAX'); g(10,PAPER.w); g(20,PAPER.h); g(0,'ENDSEC');
  g(0,'SECTION'); g(2,'TABLES');
  g(0,'TABLE'); g(2,'LTYPE'); g(70,1); g(0,'LTYPE'); g(2,'CONTINUOUS'); g(70,0); g(3,'Solid line'); g(72,65); g(73,0); g(40,0); g(0,'ENDTAB');
  g(0,'TABLE'); g(2,'LAYER'); g(70,LAYERS.length); LAYERS.forEach(l => { g(0,'LAYER'); g(2,l.dxf); g(70,0); g(62,l.aci); g(6,'CONTINUOUS'); }); g(0,'ENDTAB');
  g(0,'ENDSEC');
  g(0,'SECTION'); g(2,'ENTITIES');
  const line = (L,a,b) => { g(0,'LINE'); g(8,L); g(10,n(a.x)); g(20,n(a.y)); g(30,0); g(11,n(b.x)); g(21,n(b.y)); g(31,0); };
  const text = (L,p,h,t,rot,center) => { g(0,'TEXT'); g(8,L); g(10,n(p.x)); g(20,n(p.y)); g(30,0); g(40,n(h)); g(1,dxfText(t)); if(rot) g(50,n(deg(rot))); if(center){ g(72,1); g(11,n(p.x)); g(21,n(p.y)); g(31,0); } };
  doc.ents.filter(visible).forEach(e => {
    const L = (LBY[e.layer] || LBY.wall).dxf;
    if(e.type === 'line') line(L, P(e.x1,e.y1), P(e.x2,e.y2));
    else if(e.type === 'pline'){ g(0,'POLYLINE'); g(8,L); g(66,1); g(10,0); g(20,0); g(30,0); g(70, e.closed ? 1 : 0); e.pts.forEach(q => { g(0,'VERTEX'); g(8,L); g(10,n(q[0])); g(20,n(q[1])); g(30,0); }); g(0,'SEQEND'); g(8,L); }
    else if(e.type === 'circle'){ g(0,'CIRCLE'); g(8,L); g(10,n(e.cx)); g(20,n(e.cy)); g(30,0); g(40,n(e.r)); }
    else if(e.type === 'arc'){ g(0,'ARC'); g(8,L); g(10,n(e.cx)); g(20,n(e.cy)); g(30,0); g(40,n(e.r)); g(50,n(deg(normA(e.a1)))); g(51,n(deg(normA(e.a1 + span(e))))); }
    else if(e.type === 'text') text(L, P(e.x,e.y), e.h, e.t, e.rot || 0, false);
    else if(e.type === 'dim'){ const d = dimGeom(e); line(L, d.p1, d.A); line(L, d.p2, d.B); line(L, d.A, d.B); text(L, d.tp, DIMH, e.ovr || fmtN(d.val), d.th, true); }
    else if(e.type === 'photo'){ const c = P(e.x,e.y), dir = P(Math.cos(e.a), Math.sin(e.a)); g(0,'CIRCLE'); g(8,L); g(10,n(c.x)); g(20,n(c.y)); g(30,0); g(40,180); const tip = add(c, mul(dir,720)), b = sub(tip, mul(dir,200)), pr = lnorm(dir); line(L, add(c, mul(dir,180)), tip); line(L, tip, add(b, mul(pr,90))); line(L, tip, sub(b, mul(pr,90))); text(L, P(c.x, c.y), 200, e.n, 0, true); }
  });
  g(0,'ENDSEC'); g(0,'EOF');
  return out.join('\r\n') + '\r\n';
}

let tut = {id:null, step:0, b:null};
function snapEv(){ return {zoom:ev.zoom, pan:ev.pan, fit:ev.fit, undo:ev.undo, lines:of('line').length, exp:Object.assign({}, ev.exp), done:Object.assign({}, ev.done)}; }
function startLesson(id, noPrep){
  const L = LES.find(x => x.id === id); if(!L) return;
  if(L.prep && !noPrep){
    if(doc.ents.length && !confirm('レッスン用の図面に入れ替えます（今の図面は「戻す」で戻せます）。よろしいですか？')) return;
    if(C) cancelCmd(true);
    commit(() => { doc = L.prep(); }); sel.clear(); selChanged();
  }
  tut = {id, step:0, b:snapEv()}; ev.area = null; ev.dist = null;
  if(isWide()) showSide('learn'); else { st.side = 'learn'; setSideOpen(false); }
  renderLearn(); checkTut();
  if(L.prep && !noPrep) requestAnimationFrame(() => fitAll(true));
  if($('#manual').open) $('#manual').close();
  if(!isWide()) toast('下の帯に手順が出ます。「手順」で詳しい説明を開けます', 3500);
}
let tutT = null;
function schedTut(){ clearTimeout(tutT); tutT = setTimeout(checkTut, 120); }
function checkTut(){
  if(!tut.id) return;
  const L = LES.find(x => x.id === tut.id); let moved = false;
  while(tut.step < L.steps.length){ const s = L.steps[tut.step]; if(s.input) break; let ok = false; try{ ok = !!s.chk(tut.b); }catch(err){} if(!ok) break; tut.step++; moved = true; }
  if(moved){ if(tut.step >= L.steps.length){ st.lesDone[L.id] = 1; save(); toast('レッスン「'+L.t+'」完了。おつかれさまでした', 4000); } else toast('できました。次へ進みます', 1600); }
  renderLearn();
}
function renderLesBar(){
  const bar = $('#lesBar'); if(!bar) return;
  const L = tut.id ? LES.find(x => x.id === tut.id) : null;
  const learnVisible = st.sideOpen && st.side === 'learn';
  if(!L || learnVisible){ bar.hidden = true; $('#stage').classList.remove('has-les'); return; }
  $('#stage').classList.add('has-les');
  const i = LES.indexOf(L), fin = tut.step >= L.steps.length, s = L.steps[tut.step];
  bar.innerHTML = '<div class="lt">'+(fin ? '<b>練習'+(i+1)+'</b>完了しました' : '<b>練習'+(i+1)+'｜'+(tut.step+1)+'/'+L.steps.length+'</b>'+esc(s.t)+(s.h && !st.lbMin ? '<small>'+esc(s.h)+'</small>' : ''))+'</div><button id="lbOpen">手順</button><button id="lbClose" aria-label="練習を閉じる">×</button>';
  bar.hidden = false;
  $('#lbOpen').addEventListener('click', () => showSide('learn'));
  $('.lt', bar).addEventListener('click', () => { st.lbMin = !st.lbMin; save(); renderLesBar(); });
  $('#lbClose').addEventListener('click', () => { tut = {id:null, step:0, b:null}; renderLearn(); });
}
function renderLearn(){
  const box = $('#p-learn'); $$('.hl').forEach(x => x.classList.remove('hl'));
  renderLesBar();
  if(!tut.id){
    const done = LES.filter(l => st.lesDone[l.id]).length;
    box.innerHTML = '<h3>練習（チュートリアル）</h3><p class="note">説明書で読んだ操作を、実際の画面で1つずつ練習します。手順ができると自動でチェックが付きます。上から順に進めるのがおすすめです（'+done+'／'+LES.length+'完了）。</p><ul class="les">'+
      LES.map((l,i) => '<li><button data-les="'+l.id+'"><span class="no">'+(i+1)+'</span><span>'+esc(l.t)+'</span><span class="st'+(st.lesDone[l.id] ? ' ok' : '')+'">'+(st.lesDone[l.id] ? '済' : '未')+'</span></button></li>').join('')+'</ul>'+
      '<div class="row"><button class="sb" id="openMan">説明書を開く</button></div>';
    $$('[data-les]', box).forEach(b => b.addEventListener('click', () => startLesson(b.dataset.les)));
    $('#openMan').addEventListener('click', () => openManual());
    return;
  }
  const L = LES.find(x => x.id === tut.id), i = LES.indexOf(L), fin = tut.step >= L.steps.length;
  let h = '<p class="note" style="margin:0">レッスン '+(i+1)+'／'+LES.length+'</p><h3 style="margin-top:2px">'+esc(L.t)+'</h3><p class="note">'+esc(L.goal)+'</p><ol class="steps">';
  L.steps.forEach((s,j) => {
    const cls = j < tut.step ? 'ok' : j === tut.step ? 'now' : '';
    h += '<li class="'+cls+'">'+esc(s.t)+(s.h && j === tut.step ? '<span class="h">'+esc(s.h)+'</span>' : '')+
      (s.input && j === tut.step ? '<div class="row"><input id="tutIn" type="text" inputmode="decimal" placeholder="例 0.00" aria-label="答え"><span class="note" style="align-self:center">㎡</span><button class="sb go" id="tutChk">判定</button></div><span class="h" id="tutRes"></span>' : '')+'</li>';
  });
  h += '</ol>';
  if(fin) h += '<div class="box"><b>完了しました。</b>'+(LES[i+1] ? '次は「'+esc(LES[i+1].t)+'」です。' : 'すべてのレッスンが終わりました。')+'</div>';
  h += '<div class="row">'+(fin && LES[i+1] ? '<button class="sb go" id="tutNext">次のレッスンへ</button>' : '')+'<button class="sb" id="tutRe">最初からやり直す</button><button class="sb" id="tutList">一覧に戻る</button></div>';
  box.innerHTML = h;
  const s = L.steps[tut.step];
  if(s && s.hl){
    const m = s.hl.match(/data-c="([A-Z]+)"/);
    if(m && GROUPS[st.g].indexOf(m[1]) < 0){ const g = Object.keys(GROUPS).find(k => GROUPS[k].indexOf(m[1]) >= 0); if(g){ st.g = g; save(); renderTools(); } }
    $$(s.hl).forEach(x => x.classList.add('hl'));
  }
  if(s && s.input){ const chk = () => { const v = toHalf($('#tutIn').value.trim()); if(v === s.input || near(parseFloat(v), parseFloat(s.input), 1e-6)){ tut.step++; toast('正解です', 1600); checkTut(); } else { $('#tutRes').textContent = near(parseFloat(v), 9.94, 1e-6) ? '四捨五入ではなく、小数第3位を「切り捨て」ます。' : 'もう一度。9.9372 を小数第2位まで（第3位切捨て）にします。'; } };
    $('#tutChk').addEventListener('click', chk); $('#tutIn').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); chk(); } }); }
  const nx = $('#tutNext'); if(nx) nx.addEventListener('click', () => startLesson(LES[i+1].id));
  $('#tutRe').addEventListener('click', () => startLesson(L.id));
  $('#tutList').addEventListener('click', () => { tut = {id:null, step:0, b:null}; renderLearn(); });
}

/* ================= 説明書 ================= */
const MAN = [
 {id:'m1', t:'1. はじめに（画面の見方）', les:'l1', h:`
<p>このアプリは、補償コンサルタントの図面（事前・事後調査の平面図など）を想定した、CADの練習用ソフトです。大手CADソフト（AutoCAD、Jw_cadなど）と同じ考え方で操作できるようにしてあり、ここで覚えた操作はほかのCADでもそのまま役立ちます。</p>
<h3>画面の5つの場所</h3>
<div class="tw"><table><tr><th>場所</th><th>役割</th></tr>
<tr><td>上：コマンドライン</td><td>今のコマンドと、次に何をすればよいか（プロンプト）が出ます。右の入力欄に数値やコマンドを入れて「確定」。</td></tr>
<tr><td>左：ツール</td><td>「描く」「修正」「測る」「補償」の4つに分かれたコマンドのボタン。</td></tr>
<tr><td>中央：作図エリア</td><td>A3の用紙が縮尺1/100で置いてあります。数字はすべて実物の長さ（mm）です。</td></tr>
<tr><td>右：パネル</td><td>プロパティ（選んだ図形の数値）、レイヤ、練習、設定。スマホでは「パネル」ボタンで開閉します。</td></tr>
<tr><td>下：ステータスバー</td><td>スナップ・直交・極トラッキングのオン／オフ、現在レイヤ、カーソルの座標。</td></tr></table></div>
<div class="tipbox">迷ったら：上の<b>取消</b>（Esc）で今の操作をやめ、<b>戻す</b>（Ctrl＋Z）で1つ前に戻れます。右下の<b>全体</b>で図面全体が見えます。</div>`},
 {id:'m2', t:'2. CADの基本の考え方', h:`
<h3>実寸で描く</h3><p>CADでは、紙に合わせて縮めて描くのではなく、<b>実物の大きさ（mm）でそのまま描きます</b>。3,640mmの壁は3640と入力します。縮尺（1/100）は、用紙に収めて表示・印刷するときの倍率です。このアプリの用紙はA3（420×297mm）なので、実寸で42m×29.7mまで描けます。</p>
<h3>座標</h3><p>用紙の左下が原点（0,0）。右がX、上がYのプラスです。角度は<b>右が0°、上が90°、反時計回りがプラス</b>です（AutoCADと同じ）。</p>
<h3>レイヤ</h3><p>図形を種類ごとに分けて入れる透明なシートです。壁は「1 壁」、寸法は「3 寸法」のように分けると、表示・印刷の切替や、ほかの人の修正がしやすくなります。描く前に「現在レイヤ」を確かめる習慣をつけましょう。</p>
<h3>図形の種類</h3><p>線・ポリライン（つながった折れ線。矩形もこれ）・円・円弧・文字・寸法・撮影位置があります。</p>`},
 {id:'m3', t:'3. 画面の操作（機器別）', les:'l1', h:`
<div class="tw"><table><tr><th>操作</th><th>マウス</th><th>ノートPC（タッチパッド）</th><th>iPhone（横向き）</th></tr>
<tr><td>点を指定・選ぶ</td><td>左クリック</td><td>クリック</td><td>指を置く → ルーペで位置を合わせて離す</td></tr>
<tr><td>拡大・縮小</td><td>ホイール</td><td>2本指でピンチ（Ctrl＋2本指スクロールでも）</td><td>2本指でピンチ</td></tr>
<tr><td>画面を動かす</td><td>中ボタン・右ボタンでドラッグ</td><td>右下の「手」をオンにしてドラッグ（設定でスクロール＝画面移動にもできる）</td><td>2本指でドラッグ</td></tr>
<tr><td>確定（Enter）</td><td>右クリック・Enter・Space</td><td>Enter・2本指クリック</td><td>上の「確定」</td></tr>
<tr><td>取消（Esc）</td><td>Esc</td><td>Esc</td><td>上の「取消」</td></tr>
<tr><td>数値を入れる</td><td colspan="2">そのままキーボードで打つ（入力欄を押さなくてよい）</td><td>上の「数値」でテンキーを出す</td></tr></table></div>
<div class="tipbox">iPhoneのルーペは、AutoCADのモバイル版やARES Touchなど、スマホ向けCADと同じ仕組みです。指で隠れる部分を拡大して見せるので、端点などにぴったり合わせられます。</div>
<p>右クリックの動作は「設定」で、AutoCAD風（確定）とJw_cad風（点の読み取り）を切り替えられます。</p>`},
 {id:'m4', t:'4. 点の指定とスナップ', les:'l4', h:`
<p>CADで一番大事なのは、<b>点を正確に指定すること</b>です。カーソルを図形に近づけると、決まった点に自動で吸い付きます（オブジェクトスナップ）。</p>
<div class="tw"><table><tr><th>マーク</th><th>名前</th><th>吸い付く所</th></tr>
<tr><td>□</td><td>端点</td><td>線の端、矩形の角、ポリラインの頂点</td></tr>
<tr><td>△</td><td>中点</td><td>線・辺の真ん中</td></tr>
<tr><td>×</td><td>交点</td><td>2つの図形が交わる点</td></tr>
<tr><td>○</td><td>中心</td><td>円・円弧の中心（円周に近づけても出ます）</td></tr>
<tr><td>⊥</td><td>垂線</td><td>直前の点から、図形へ垂直に下ろした点</td></tr>
<tr><td>⧖</td><td>近接点</td><td>図形の上のいちばん近い点（初期はオフ）</td></tr></table></div>
<h3>直交と極トラッキング</h3><p><b>直交</b>（F8）をオンにすると、水平・垂直にしか描けなくなります。<b>極トラッキング</b>（F10）は、45°ごと（設定で変更）の方向に近づくと緑の点線が出て吸い付きます。どちらも「次の点」の向きを決める補助です。</p>
<h3>グリッド</h3><p>点の格子です。「グリッド」をオンにすると格子に吸い付きます（910mm＝半間など、設定で間隔を変更）。</p>`},
 {id:'m5', t:'5. 数値で正確に描く', les:'l2', h:`
<p>寸法が決まっている線は、クリックではなく数値で描きます。入力欄に打って「確定」（Enter）。</p>
<div class="tw"><table><tr><th>入力</th><th>意味</th><th>例</th></tr>
<tr><td><code>1820</code></td><td>カーソルの方向に1,820（直接距離入力）</td><td>右に向けて1820 → 右へ1,820の線</td></tr>
<tr><td><code>3640,2730</code></td><td>1点目：原点からの位置／2点目以降：直前の点から右へ3,640・上へ2,730</td><td>矩形の2つ目の角</td></tr>
<tr><td><code>@1820,0</code></td><td>直前の点からの相対座標（@はあってもなくても同じ）</td><td>右へ1,820</td></tr>
<tr><td><code>#0,0</code></td><td>2点目以降で、原点からの位置（絶対座標）を指定</td><td>原点へ戻る</td></tr>
<tr><td><code>1000&lt;45</code></td><td>長さ1,000・角度45°（極座標）</td><td>斜め45°の線</td></tr>
<tr><td><code>-1820,0</code></td><td>左へ1,820（マイナスは左・下）</td><td>四角を閉じる</td></tr></table></div>
<p>この「2点目以降は相対座標」というルールは、AutoCADのダイナミック入力の考え方と同じです。全角の数字や「、」で入れても大丈夫です。</p>`},
 {id:'m6', t:'6. 描くコマンド', les:'l3', h:`
<div class="tw"><table><tr><th>ボタン</th><th>入力</th><th>手順</th></tr>
<tr><td>線</td><td>L</td><td>始点 → 次の点 → 次の点…（つながる線を続けて描ける）→ Enterで終了。「閉じる」で始点へ戻る。「1つ戻す」で1本取り消し。</td></tr>
<tr><td>ポリライン</td><td>PL</td><td>点を順に指定 → Enterで確定。1つの図形としてまとまる。「閉じる」で閉じた図形に。</td></tr>
<tr><td>矩形</td><td>REC</td><td>1つ目の角 → もう1つの角（例 3640,2730）。または「寸法で指定」→ 幅 → 高さ → 置く向き。</td></tr>
<tr><td>円</td><td>C</td><td>中心 → 半径（数値または点）。「直径で指定する」も可。</td></tr>
<tr><td>円弧</td><td>A</td><td>中心 → 始点（半径が決まる）→ 終点の方向（反時計回り）。「向きを反対にする」で時計回り。</td></tr>
<tr><td>文字</td><td>T</td><td>位置（文字の左下）→ 文字を入力して確定。高さは用紙上2.5／3.5／5mm。</td></tr>
<tr><td>寸法</td><td>DIM</td><td>1点目 → 2点目 → 寸法線の位置。「自動」は置く位置で水平・垂直を判断。「平行」は斜めの長さ。</td></tr></table></div>`},
 {id:'m7', t:'7. 選択とグリップ', les:'l7', h:`
<h3>選び方</h3><ul><li><b>クリック（タップ）</b>：その図形を選ぶ。もう一度クリックで解除。Shift＋クリックで解除。</li>
<li><b>窓選択</b>：左から右へ囲む（青い枠）。枠にすっぽり入った図形だけ選ばれます。</li>
<li><b>交差選択</b>：右から左へ囲む（緑の点線の枠）。枠に触れた図形も選ばれます。</li>
<li>Ctrl＋A ですべて選択、Esc で選択解除。ロック中のレイヤの図形は選べません。</li></ul>
<h3>グリップ</h3><p>選んだ図形に出る青い四角です。つかんでドラッグ（またはクリックしてから移動先をクリック）すると、端点や頂点だけを動かせます。線の真ん中のグリップは線全体の移動、円の四方のグリップは半径の変更です。</p>
<h3>プロパティ</h3><p>1つ選ぶと、右のパネルに長さ・座標・半径・レイヤなどが数値で出て、その場で書き換えられます。図面修正ではここを一番よく使います。</p>`},
 {id:'m8', t:'8. 修正コマンド', les:'l6', h:`
<p>修正コマンドは、<b>先に図形を選んでからボタンを押す</b>か、<b>ボタンを押してから選んで「選択完了」</b>のどちらでも使えます。</p>
<div class="tw"><table><tr><th>ボタン</th><th>入力</th><th>手順</th></tr>
<tr><td>移動</td><td>M</td><td>基点 → 移動先（例 1820,0）</td></tr>
<tr><td>複写</td><td>CO</td><td>基点 → 複写先（続けて何個でも）→ Enter</td></tr>
<tr><td>回転</td><td>RO</td><td>中心 → 角度（例 90。反時計回りが＋）</td></tr>
<tr><td>鏡像</td><td>MI</td><td>対称軸の2点 → 元を「残す／消す」</td></tr>
<tr><td>オフセット</td><td>O</td><td>距離 → 図形 → 作る側。続けて何本でも。壁厚や通り芯の作図に。</td></tr>
<tr><td>トリム</td><td>TR</td><td>切り取りたい部分をクリック。交わる図形すべてが境界になる（境界がない線は図形ごと削除）。</td></tr>
<tr><td>延長</td><td>EX</td><td>延ばしたい線の端の近くをクリック。いちばん近い図形まで延びる。</td></tr>
<tr><td>コーナー</td><td>F</td><td>2本の線を順にクリック（残したい側）。延ばす・切るをして角を作る。</td></tr>
<tr><td>分解</td><td>X</td><td>ポリライン（矩形）をばらばらの線にする。</td></tr>
<tr><td>削除</td><td>E</td><td>選んだ図形を消す（Deleteキーでも）。</td></tr></table></div>
<div class="tipbox">トリムの「交わる図形がすべて境界になる」動きは、AutoCAD 2021以降のクイックモードと同じです。</div>`},
 {id:'m9', t:'9. 測る（距離・面積）', les:'l8', h:`
<p><b>距離</b>（DI）：2点を指定すると、長さ・ΔX・ΔY・角度が出ます。<b>面積</b>（AA）：閉じた図形をクリックするか、「頂点を順に指定する」で囲むと、面積と周長が出ます。</p>
<p>面積には、地盤変動影響調査算定要領（岡山市版の例）の端数処理（m単位で計算し、小数第2位まで・第3位切捨て）を当てはめた値も表示します。例：3.64m×2.73m＝9.9372㎡ → <b>9.93㎡</b>。実務では、発注者の要領に従ってください。</p>`},
 {id:'m10', t:'10. 補償調査の図面を描く', les:'l10', h:`
<p>事前・事後調査の建物平面図は縮尺1/100で作り、撮影した位置や損傷の位置を書き込みます。このアプリの「補償」グループはそのための道具です。</p>
<div class="tw"><table><tr><th>レイヤ</th><th>入れる物</th></tr>
<tr><td>0 通り芯</td><td>柱・壁の中心線（一点鎖線）。面積は中心間で測るのが基本。</td></tr>
<tr><td>1 壁</td><td>壁の線</td></tr><tr><td>2 建具・家具</td><td>戸・窓・家具</td></tr>
<tr><td>3 寸法</td><td>寸法（自動でここに入る設定）</td></tr><tr><td>4 文字</td><td>室名・仕上げ・損傷の注記</td></tr>
<tr><td>5 損傷</td><td>亀裂などの損傷線（「損傷線」で自動）</td></tr><tr><td>6 写真</td><td>撮影位置（「撮影」で自動・番号付き）</td></tr>
<tr><td>7 補助線</td><td>作図のための仮の線（点線）。印刷前に非表示に。</td></tr></table></div>
<ul><li><b>撮影位置</b>：立ち位置 → 向けた方向。番号は1から自動。写真台帳の番号と合わせます。</li>
<li><b>損傷線</b>：折れ線で描き、近くに「亀裂 W0.5mm L30cm」のように損傷名と程度（幅はmm、長さはcm）を書きます。</li>
<li>壁の厚みは、通り芯から「オフセット」で両側に振り分けて描くと正確です（壁厚120mmなら60mmずつ）。</li></ul>`},
 {id:'m11', t:'11. レイヤ', les:'l11', h:`
<ul><li><b>現在レイヤ</b>：これから描く図形が入るレイヤ。下のバーかレイヤタブで変えます。</li>
<li><b>表示／非表示</b>：見せるかどうか。非表示の図形はスナップもしません。</li>
<li><b>ロック</b>：見えてスナップもするが、選択・編集はできない。大事な線を守るときに。</li>
<li>図形のレイヤは、選んでプロパティの「レイヤ」で移せます。</li></ul>`},
 {id:'m12', t:'12. 保存と書き出し', les:'l12', h:`
<ul><li><b>自動保存</b>：図面と設定は、この端末のブラウザに自動で保存されます（同じ端末・同じブラウザで開けば続きから）。</li>
<li><b>図面データを保存／開く</b>：このアプリ用のデータ（.json）。パソコンとiPhoneの間はメールやAirDropで受け渡しできます。</li>
<li><b>PNG画像</b>：A3用紙ごと、1/100の画像に。印刷や共有に。表示中のレイヤだけが出ます。</li>
<li><b>DXF</b>：ほかのCADで開くための形式（単位mm・実寸）。レイヤ名は A-WALL（壁）・A-DIMS（寸法）のような英字になります。寸法は線と文字に分解して書き出します。日本語の文字は \\U+ 形式で書くため、ソフトによっては文字化けすることがあります。</li></ul>`},
 {id:'m13', t:'13. コマンド・キー一覧', h:`
<div class="tw"><table><tr><th>コマンド</th><th>入力</th><th>コマンド</th><th>入力</th></tr>
<tr><td>線</td><td>L</td><td>移動</td><td>M</td></tr><tr><td>ポリライン</td><td>PL</td><td>複写</td><td>CO</td></tr>
<tr><td>矩形</td><td>REC</td><td>回転</td><td>RO</td></tr><tr><td>円</td><td>C</td><td>鏡像</td><td>MI</td></tr>
<tr><td>円弧</td><td>A</td><td>オフセット</td><td>O</td></tr><tr><td>文字</td><td>T</td><td>トリム</td><td>TR</td></tr>
<tr><td>寸法</td><td>DIM</td><td>延長</td><td>EX</td></tr><tr><td>撮影位置</td><td>PH</td><td>コーナー</td><td>F</td></tr>
<tr><td>損傷線</td><td>DMG</td><td>分解</td><td>X</td></tr><tr><td>距離</td><td>DI</td><td>削除</td><td>E</td></tr>
<tr><td>面積</td><td>AA</td><td>元に戻す</td><td>U・Ctrl＋Z</td></tr></table></div>
<div class="tw"><table><tr><th>キー</th><th>動作</th></tr>
<tr><td><kbd>Enter</kbd>・<kbd>Space</kbd></td><td>確定。何もしていないときは直前のコマンドをもう一度</td></tr>
<tr><td><kbd>Esc</kbd></td><td>取消・選択解除</td></tr><tr><td><kbd>Delete</kbd></td><td>選んだ図形を削除</td></tr>
<tr><td><kbd>F3</kbd>／<kbd>F8</kbd>／<kbd>F9</kbd>／<kbd>F10</kbd></td><td>スナップ／直交／グリッド吸着／極トラッキングの切替</td></tr>
<tr><td><kbd>Ctrl</kbd>＋<kbd>Z</kbd>／<kbd>Y</kbd>／<kbd>A</kbd></td><td>元に戻す／やり直し／すべて選択</td></tr></table></div>`},
 {id:'m14', t:'14. 他のCADとの対応', h:`
<p>会社で使うCADは入社後に確認しますが、考え方は共通です。名前の対応の目安です（製品・バージョンで細部は異なります）。</p>
<div class="tw"><table><tr><th>このアプリ</th><th>AutoCAD</th><th>Jw_cad</th></tr>
<tr><td>線</td><td>線分（LINE）</td><td>線（／）</td></tr><tr><td>ポリライン</td><td>ポリライン（PLINE）</td><td>連続線</td></tr>
<tr><td>矩形</td><td>長方形（RECTANG）</td><td>矩形（□）</td></tr><tr><td>円・円弧</td><td>円（CIRCLE）・円弧（ARC）</td><td>円（○）</td></tr>
<tr><td>文字</td><td>文字記入（TEXT）</td><td>文字（A）</td></tr><tr><td>寸法</td><td>長さ寸法記入・平行寸法記入</td><td>寸法</td></tr>
<tr><td>移動・複写</td><td>移動（MOVE）・複写（COPY）</td><td>移動・複写</td></tr><tr><td>回転・鏡像</td><td>回転（ROTATE）・鏡像（MIRROR）</td><td>移動・複写の「回転角」「反転」</td></tr>
<tr><td>オフセット</td><td>オフセット（OFFSET）</td><td>複線</td></tr><tr><td>トリム・延長</td><td>トリム（TRIM）・延長（EXTEND）</td><td>伸縮</td></tr>
<tr><td>コーナー</td><td>フィレット（半径0）</td><td>コーナー</td></tr><tr><td>距離・面積</td><td>計測（DIST・AREA）</td><td>測定</td></tr>
<tr><td>スナップ（端点・交点など）</td><td>オブジェクトスナップ</td><td>右クリック（読取点）</td></tr>
<tr><td>直交・極トラッキング</td><td>直交モード・極トラッキング</td><td>水平・垂直</td></tr></table></div>
<p>Jw_cadは、左クリックで任意の点、右クリックで既存の端点や交点を読み取るのが基本です。「設定」で右クリックをJw_cad風にすると、その感覚で練習できます。</p>`},
 {id:'m15', t:'15. 困ったとき', h:`
<div class="tw"><table><tr><th>こんなとき</th><th>こうする</th></tr>
<tr><td>思った所に点が付かない</td><td>スナップのマーク（□△×）が出てからクリック。吸い付きすぎるときは下のバーで一部をオフに。</td></tr>
<tr><td>線が斜めにならない</td><td>「直交」がオンになっていないか確認。</td></tr>
<tr><td>数値を入れても反応しない</td><td>先にツール（線・矩形など）を選ぶ。上のプロンプトが「次の点を指定」などになっているか確認。</td></tr>
<tr><td>図面が見えなくなった</td><td>右下の「全体」。レイヤが非表示になっていないかも確認。</td></tr>
<tr><td>図形が選べない</td><td>そのレイヤがロックされていないか確認。</td></tr>
<tr><td>操作を間違えた</td><td>「取消」で今の操作をやめ、「戻す」で1つ前へ。</td></tr>
<tr><td>iPhoneで細かい所が押せない</td><td>2本指で拡大してから。指を置いたままルーペで合わせ、離した所が点になります。</td></tr></table></div>`}
];
function openManual(id){
  const d = $('#manual');
  $('#manNav').innerHTML = '<h2>説明書</h2>' + MAN.map(m => '<button data-m="'+m.id+'">'+esc(m.t)+'</button>').join('');
  const show = mid => { const m = MAN.find(x => x.id === mid) || MAN[0];
    $$('#manNav button').forEach(b => b.setAttribute('aria-current', b.dataset.m === m.id ? 'true' : 'false'));
    const L = m.les ? LES.find(x => x.id === m.les) : null;
    $('#manBody').innerHTML = '<h2>'+esc(m.t)+'</h2>'+m.h+(L ? '<div class="row" style="margin-top:18px"><button class="sb go" data-golesson="'+L.id+'">この内容を練習する（レッスン「'+esc(L.t)+'」）</button></div>' : '');
    $('#manBody').scrollTop = 0; st.man = m.id; save();
    const gb = $('[data-golesson]', $('#manBody')); if(gb) gb.addEventListener('click', () => { d.close(); startLesson(gb.dataset.golesson); }); };
  $$('#manNav button').forEach(b => b.addEventListener('click', () => show(b.dataset.m)));
  show(id || st.man || 'm1');
  if(typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}
$('#bMan').addEventListener('click', () => openManual());

/* ================= 起動 ================= */
function renderAll(){ renderTools(); renderBar(); renderLayers(); renderSettings(); renderProps(); renderLearn(); renderPrompt(); updateUndo(); applyView(); }
applyTheme();
const savedOpen = (st.sideOpen === null || st.sideOpen === undefined) ? isWide() : !!st.sideOpen;
showSide(st.side || 'prop', true);
setSideOpen(savedOpen);
renderAll();
if(window.ResizeObserver) new ResizeObserver(() => applyView()).observe(svg); else window.addEventListener('resize', applyView);
requestAnimationFrame(() => { if(doc.ents.length) fitAll(true); else { view.s = clampS(W()/16000); view.cx = 9000; view.cy = 9000; applyView(); } });
if(!st.seen){ st.seen = 1; save(); setTimeout(() => toast('はじめての方は、上の「説明書」と「練習」からどうぞ', 5000), 400); }
window.__cad = {submit, startCmd, clickWorld:(x,y,o) => { const s = toScreen(P(x,y)); clickAt(s, o || {}); }, hoverWorld:(x,y) => { const s = toScreen(P(x,y)); hoverAt(s, false); }, doc:() => doc, sel:() => sel, st:() => st, ev, startLesson, tut:() => tut, view:() => view, buildDXF, selectIds:ids => { sel.clear(); ids.forEach(i => sel.add(i)); selChanged(); }};
})();

</script>
</body>
</html>
